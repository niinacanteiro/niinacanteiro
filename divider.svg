<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 34" width="100%">
<defs><filter id="g" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
.b{fill:none;stroke:#3D2A14;stroke-width:2}
.p{fill:none;stroke-linecap:round;filter:url(#g)}
.a{stroke-width:3;stroke-dasharray:70 1200;animation:r 4s linear infinite,ca 4s linear infinite}
.at{stroke-width:2;opacity:.35;stroke-dasharray:150 1200;animation:r 4s linear infinite,ca 4s linear infinite;animation-delay:-.12s,-.12s}
.v{stroke-width:3;stroke-dasharray:70 1200;animation:r 5s linear infinite,cv 5s linear infinite}
.vt{stroke-width:2;opacity:.35;stroke-dasharray:150 1200;animation:r 5s linear infinite,cv 5s linear infinite;animation-delay:-.12s,-.12s}
@keyframes r{from{stroke-dashoffset:1080}to{stroke-dashoffset:-80}}
@keyframes ca{0%{stroke:#8B4513}35%{stroke:#C2410C}70%{stroke:#FF7A1A}100%{stroke:#FFC531}}
@keyframes cv{0%{stroke:#FFB347}35%{stroke:#FF7A1A}70%{stroke:#DC2626}100%{stroke:#7F1D1D}}
.d{animation:pd 3s ease-in-out infinite;filter:url(#g)}
@keyframes pd{0%{fill:#8B4513;opacity:.4}50%{fill:#FF7A1A;opacity:1}100%{fill:#B91C1C;opacity:.4}}
</style>
<path class="b" d="M0,10 H380 L392,4 H608 L620,10 H1000"/>
<path class="p at" d="M0,10 H380 L392,4 H608 L620,10 H1000"/>
<path class="p a" d="M0,10 H380 L392,4 H608 L620,10 H1000"/>
