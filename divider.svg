<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" width="100%">
<defs><filter id="g" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>
.b{fill:none;stroke:#2A1E3D;stroke-width:2}
.p{fill:none;stroke-linecap:round;filter:url(#g)}
.a,.at{stroke-dasharray:70 1200;animation:ir 4s linear infinite,ca 4s linear infinite}
.at{stroke-dasharray:150 1200;stroke-width:2;opacity:.35;animation-delay:-.12s,-.12s}
.a{stroke-width:3}
.v,.vt{stroke-dasharray:70 1200;animation:ir 5s linear infinite,cv 5s linear infinite}
.vt{stroke-dasharray:150 1200;stroke-width:2;opacity:.35;animation-delay:-.12s,-.12s}
.v{stroke-width:3}
@keyframes ir{from{stroke-dashoffset:1080}to{stroke-dashoffset:-80}}

@keyframes ca{0%{stroke:#A855F7}35%{stroke:#EC4899}70%{stroke:#FF7A1A}100%{stroke:#FFC531}}
@keyframes cv{0%{stroke:#22D3EE}35%{stroke:#3B82F6}70%{stroke:#8B5CF6}100%{stroke:#E879F9}}
.d{animation:pd 3s linear infinite;filter:url(#g)}
@keyframes pd{0%{fill:#A855F7;opacity:.4}50%{fill:#22D3EE;opacity:1}100%{fill:#A855F7;opacity:.4}}
</style>
<path class="b" d="M0,12 H380 L392,4 H608 L620,12 H1000"/>
<path class="p at" d="M0,12 H380 L392,4 H608 L620,12 H1000"/>
<path class="p a" d="M0,12 H380 L392,4 H608 L620,12 H1000"/>
<path class="p vt" d="M1000,12 H620 L608,4 H392 L380,12 H0"/>
<path class="p v" d="M1000,12 H620 L608,4 H392 L380,12 H0"/>
<circle class="d" cx="392" cy="4" r="3"/><circle class="d" cx="608" cy="4" r="3" style="animation-delay:-1.5s"/>
</svg>
